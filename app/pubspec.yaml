name: ninho
description: Planejamento financeiro e acompanhamento familiar.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: 2.10.0
  http: 1.5.0
  intl: ^0.20.2
  shared_preferences: 2.5.6
  google_mobile_ads: 9.1.0
  url_launcher: 6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  # Nunito 3.602, the static weights of the official Google Fonts download.
  # Its SIL Open Font License 1.1 ships with the fonts, as the license asks.
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
